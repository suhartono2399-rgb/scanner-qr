<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>STOCK OPNAME</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 500px;
      margin: auto;
      background: #f5f5f5;
    }

    .box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
    }

    button, input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 15px;
      font-size: 16px;
      border-radius: 8px;
    }

    button {
      border: none;
      background: #1976d2;
      color: white;
      font-weight: bold;
    }

    input {
      border: 1px solid #ccc;
    }

    #reader {
      width: 100%;
      margin-top: 15px;
    }

    .hasil {
      margin-top: 20px;
      padding: 15px;
      background: #f0f7ff;
      border-radius: 8px;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>STOCK OPNAME</h2>

  <button onclick="mulaiScanner()">
    ?? SCAN BARCODE
  </button>

  <div id="reader"></div>

  <label>Barcode / NO_STOCK</label>

  <input
    type="text"
    id="barcode"
    placeholder="Atau masukkan barcode manual"
  >

  <button onclick="cariBarang()">
    CARI BARANG
  </button>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxK_54TKlD52bSvHw05jTCGx4PQI7BR9oJMXtMzhW41pphOVXgJrjZErQkmfNH0Nhs/exec";

let scanner = null;


/* =========================
   SCANNER BARCODE
========================= */

function mulaiScanner() {

  if (scanner) {
    return;
  }

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },

    {
      fps: 10,
      qrbox: {
        width: 300,
        height: 150
      }
    },

    function(decodedText) {

      document.getElementById("barcode").value =
        decodedText;

      scanner.stop().then(function() {

        scanner.clear();
        scanner = null;

        cariBarang();

      });

    },

    function(errorMessage) {
      // Barcode belum terbaca
    }

  ).catch(function(error) {

    alert(
      "Kamera tidak dapat digunakan: " + error
    );

  });
}


/* =========================
   CARI BARANG
========================= */

function cariBarang() {

  const barcode =
    document.getElementById("barcode").value.trim();

  if (!barcode) {

    alert(
      "Masukkan atau scan barcode terlebih dahulu"
    );

    return;
  }

  /*
    Langsung membuka Apps Script
    dengan barcode yang dicari.
  */

  const url =
    API_URL +
    "?barcode=" +
    encodeURIComponent(barcode);

  window.location.href = url;
}

</script>

</body>
</html>
