<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner QR</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      font-size: 24px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      background: white;
    }

    #hasil {
      margin-top: 20px;
      padding: 15px;
      background: white;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>Scanner QR</h1>

  <div id="reader"></div>

  <div id="hasil">
    Silakan arahkan kamera ke QR Code
  </div>

  <script>
    function berhasilScan(teks) {
      document.getElementById("hasil").innerHTML =
        "QR terbaca:<br><strong>" + teks + "</strong>";
    }

    function gagalScan(error) {
      // Abaikan error saat QR belum terbaca
    }

    const scanner = new Html5QrcodeScanner(
      "reader",
      {
        fps: 10,
        qrbox: {
          width: 250,
          height: 250
        }
      },
      false
    );

    scanner.render(berhasilScan, gagalScan);
  </script>

</body>
</html>
